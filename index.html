<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Gastos</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --tx:#1e293b; --mu:#64748b; --ln:#e6ebf3; --in:#f6f8fc;
  --verde:#16a34a; --rojo:#e11d48; --azul:#2563eb; --amar:#f59e0b; --vio:#7c3aed;
  --sv:#dcfce7; --sr:#ffe4e6; --sa:#dbeafe; --sy:#fef3c7; --sp:#ede9fe;
  --sombra:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1420; --card:#171f2e; --tx:#e8edf6; --mu:#93a0b5; --ln:#263045; --in:#1d2738;
    --verde:#22c55e; --rojo:#fb7185; --azul:#60a5fa; --amar:#fbbf24; --vio:#a78bfa;
    --sv:#12351f; --sr:#3d1622; --sa:#162a4d; --sy:#3a2d0c; --sp:#2a2150;
    --sombra:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1420; --card:#171f2e; --tx:#e8edf6; --mu:#93a0b5; --ln:#263045; --in:#1d2738;
  --verde:#22c55e; --rojo:#fb7185; --azul:#60a5fa; --amar:#fbbf24; --vio:#a78bfa;
  --sv:#12351f; --sr:#3d1622; --sa:#162a4d; --sy:#3a2d0c; --sp:#2a2150;
  --sombra:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Nunito',system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--tx)}
.hide{display:none!important}

/* ---------- login ---------- */
#auth{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px 16px}
#auth.on{display:flex}
.au-card{background:var(--card);border-radius:28px;box-shadow:var(--sombra);padding:32px 24px;width:100%;max-width:380px;text-align:center}
.au-emoji{font-size:56px;line-height:1}
.au-card h1{margin:10px 0 4px;font-size:26px;font-weight:900}
.au-card p{margin:0 0 22px;color:var(--mu)}
.au-card input{width:100%;margin-bottom:10px}
#au-err{color:var(--rojo);font-weight:700;min-height:20px;margin:6px 0 0;font-size:14px}

/* ---------- shell ---------- */
#app-shell{display:none}
#app-shell.on{display:block}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.hd{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:900;font-size:20px;display:flex;align-items:center;gap:6px;margin-right:auto}
.logo span{font-size:24px}
.mesnav{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--sombra)}
.mesnav button{width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:800;color:var(--mu)}
.mesnav button:hover{background:var(--in)}
.mesnav b{min-width:128px;text-align:center;font-weight:800;font-size:15px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mu);padding:4px 10px;border-radius:999px;background:var(--card)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--verde)}
.sync.va i{background:var(--amar)} .sync.mal i,.sync.choque i{background:var(--rojo)}
.sync.mal,.sync.choque{cursor:pointer;color:var(--rojo)}

nav.tabs{display:flex;gap:6px;max-width:1080px;margin:10px auto 0}
nav.tabs button{padding:8px 14px;border-radius:999px;font-weight:800;color:var(--mu);font-size:14px;white-space:nowrap}
nav.tabs button.on{background:var(--tx);color:var(--bg)}
nav.tabs button .em{margin-right:4px}
nav.tabs .sh{display:none}
@media (max-width:760px){nav.tabs .sh{display:inline}}

main{max-width:1080px;margin:0 auto;padding:8px 16px 120px}
@media (min-width:761px){header{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}}

@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:30;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:0}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 6px;font-size:11px;border-radius:12px;flex:1}
  nav.tabs button .em{margin:0;font-size:21px}
  nav.tabs button.on{background:var(--in);color:var(--tx)}
  .logo{font-size:18px}
  .mesnav b{min-width:112px;font-size:14px}
  .hd .sync{order:2}
  .hd .gear{order:2;width:32px;height:32px;font-size:15px}
  .hd .mesnav{order:3;width:100%;justify-content:space-between}
  nav.tabs button{padding:4px 2px;font-size:10.5px}
  nav.tabs .lg{display:none}
  .hero .mood{font-size:40px;right:14px;top:12px}
  .hero .big{font-size:34px}
}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);padding:18px;min-width:0}
.card h2{margin:0 0 12px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.card h2 small{margin-left:auto;font-size:13px;font-weight:700;color:var(--mu)}
.stack>*+*{margin-top:14px}
.mu{color:var(--mu)}
.vacio{color:var(--mu);text-align:center;padding:22px 8px;font-weight:600}

.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 10px 30px rgba(37,99,235,.25);position:relative;overflow:hidden}
.hero.neg{background:linear-gradient(135deg,#e11d48,#f97316)}
.hero.ok{background:linear-gradient(135deg,#16a34a,#0d9488);box-shadow:0 10px 30px rgba(22,163,74,.25)}
.meta+.meta{border-top:1px solid var(--ln);margin-top:14px;padding-top:14px}
.meta .mt b{white-space:normal}
.btn{white-space:nowrap}
@media (max-width:760px){main .hero .mood{font-size:38px;right:14px;top:12px}main .hero .big{font-size:32px;padding-right:44px}}
.hero .lbl{opacity:.85;font-weight:700;font-size:14px;padding-right:66px}
.hero .sub{padding-right:4px}
.hero .big{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.1;margin:4px 0 10px}
.hero .mood{position:absolute;right:18px;top:14px;font-size:54px;opacity:.95}
.hero .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin:8px 0 6px}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:99px}
.hero .sub{font-size:13px;opacity:.9;font-weight:700}

.kpi{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sombra);min-width:0}
.kpi .k-e{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;margin-bottom:8px}
.kpi .k-l{font-size:13px;color:var(--mu);font-weight:700}
.kpi .k-v{font-size:21px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:12px;color:var(--mu);font-weight:600}

.donut-wrap{display:flex;gap:18px;align-items:center}
.donut{width:150px;height:150px;flex:none;transform:rotate(-90deg)}
.donut text{transform:rotate(90deg);transform-origin:21px 21px;text-anchor:middle;fill:var(--tx);font-family:inherit}
.donut .d1{font-size:3.4px;fill:var(--mu);font-weight:700}
.donut .d2{font-size:5.6px;font-weight:900}
.leg{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.leg div{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.leg i{width:10px;height:10px;border-radius:4px;flex:none}
.leg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg b{font-weight:800}
.leg em{font-style:normal;color:var(--mu);font-size:12px;width:34px;text-align:right}
@media (max-width:420px){.donut-wrap{flex-direction:column}.leg{width:100%}}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:inherit}
.ax{font-size:10px;fill:var(--mu);text-anchor:middle;font-weight:700}
.ax.cur{fill:var(--tx);font-weight:900}
.gl{stroke:var(--ln);stroke-width:1}
.keys{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--mu);margin-top:8px;flex-wrap:wrap}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:var(--in)}

.pbar{height:9px;border-radius:99px;background:var(--in);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px}
.pres{display:flex;flex-direction:column;gap:12px}
.pres .r1{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:5px;gap:8px}
.pres .r1 small{color:var(--mu);font-weight:700}

.mov{display:flex;align-items:center;gap:12px;padding:10px 4px;border-radius:14px;cursor:pointer}
.mov:hover{background:var(--in)}
.mov+.mov{border-top:1px solid var(--ln)}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none}
.mt{flex:1;min-width:0}
.mt b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt small{color:var(--mu);font-weight:600;font-size:13px}
.mm{font-weight:900;white-space:nowrap}
.mm.g{color:var(--tx)} .mm.i{color:var(--verde)}
.dia{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--mu);margin:16px 4px 4px;text-transform:capitalize}
.dia:first-child{margin-top:0}

.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ln);display:grid;place-items:center;font-size:15px;font-weight:900;color:transparent;flex:none}
.chk.on{background:var(--verde);border-color:var(--verde);color:#fff}
.mov.pagado .mt b{opacity:.6}

/* ---------- controls ---------- */
.inp,select.inp{width:100%;background:var(--in);border:2px solid transparent;border-radius:14px;padding:12px 14px;outline:none;font-weight:700;min-width:0}
.inp:focus{border-color:var(--azul);background:var(--card)}
.lb{display:block;font-size:13px;font-weight:800;color:var(--mu);margin:14px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-weight:800;background:var(--in)}
.btn.pri{background:var(--azul);color:#fff}
.btn.ok{background:var(--verde);color:#fff}
.btn.del{background:var(--sr);color:var(--rojo)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.seg{display:flex;background:var(--in);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:800;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sombra)}
.seg button.on.g{color:var(--rojo)} .seg button.on.i{color:var(--verde)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--in);font-weight:700;font-size:14px;border:2px solid transparent}
.chip.on{border-color:var(--c,var(--azul));background:color-mix(in srgb,var(--c,var(--azul)) 16%,var(--card))}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1;min-width:0}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--azul);color:#fff;font-size:32px;font-weight:700;box-shadow:0 10px 26px rgba(37,99,235,.45);z-index:25;display:grid;place-items:center;line-height:1}
@media (min-width:761px){.fab{bottom:28px;right:28px}}
.tipbox{background:var(--sa);border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px}
.tipbox.y{background:var(--sy)} .tipbox.r{background:var(--sr)} .tipbox.v{background:var(--sv)}

.monto-in{display:flex;align-items:center;gap:6px;background:var(--in);border-radius:18px;padding:10px 16px;margin-top:14px;border:2px solid transparent}
.monto-in:focus-within{border-color:var(--azul)}
.monto-in span{font-size:30px;font-weight:900;color:var(--mu)}
.monto-in input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:34px;font-weight:900;padding:0}
.monto-in.g input{color:var(--rojo)} .monto-in.i input{color:var(--verde)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(15,23,42,.45)}
#sheet .pn{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@media (min-width:761px){#sheet .pn{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:26px;animation:none}}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between}
.sh-h h3{margin:0;font-size:19px;font-weight:900}
.x{width:36px;height:36px;border-radius:50%;background:var(--in);font-weight:900}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
@media (max-width:520px){table.t{font-size:12.5px}table.t td,table.t th{padding-left:3px;padding-right:3px}}
table.t th{text-align:right;color:var(--mu);font-size:12px;font-weight:800;padding:6px 6px;border-bottom:1px solid var(--ln)}
table.t td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--ln);font-weight:700;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
.tscroll{overflow-x:auto;margin:0 -4px}
.pos{color:var(--verde)} .neg{color:var(--rojo)}
input[type=range]{width:100%;accent-color:var(--azul)}
.catrow{display:grid;grid-template-columns:52px 1fr 44px 120px 36px;gap:8px;align-items:center}
.catrow+.catrow{margin-top:8px}
.catrow.c6{grid-template-columns:52px 1fr 44px 110px 36px 36px}
.gbox{border:2px solid var(--ln);border-left:6px solid var(--c);border-radius:16px;padding:10px;margin-top:12px}
.catrow.grow{padding-bottom:8px;border-bottom:1px dashed var(--ln);margin-bottom:8px}
.catrow.grow .inp:not(.em){font-weight:900;font-size:16px}
.gtot{font-size:12px;font-weight:700;text-align:center}
.gchips+.gchips{margin-top:10px}
.gchips small{display:block;font-size:12px;font-weight:800;color:var(--mu);margin-bottom:6px}
.leg .clk{cursor:pointer;border-radius:8px;margin:-3px -6px;padding:3px 6px}
.leg .clk:hover{background:var(--in)}
.leg u{text-decoration:none;color:var(--mu);font-weight:900}
.catrow .inp{padding:10px}
.catrow input.em{text-align:center;font-size:20px;padding:6px}
.catrow input[type=color]{width:44px;height:44px;border:0;padding:0;background:none;border-radius:12px;cursor:pointer}
@media (max-width:520px){.catrow{grid-template-columns:48px 1fr 40px 36px}.catrow .pr{grid-column:2/4}
  .catrow.c6{grid-template-columns:44px 1fr 40px 36px 36px}.catrow.c6 .pr{grid-column:2/4;grid-row:2}
  .catrow.grow{grid-template-columns:44px 1fr 40px 36px}.gtot{display:none}.gbox{padding:8px}}
.welcome ol{margin:10px 0 0;padding-left:20px;font-weight:700}
.welcome li{margin:6px 0}
.welcome li a{color:var(--azul);cursor:pointer;text-decoration:underline}
.gear{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--sombra);font-size:17px;display:grid;place-items:center}
.gear.on{background:var(--tx)}
.bills{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.billc{cursor:pointer;border:2px solid var(--ln);box-shadow:none;padding:16px}
.billc:hover{border-color:var(--azul)}
.billc.tj{background:linear-gradient(135deg,color-mix(in srgb,var(--vio) 10%,var(--card)),var(--card))}
.billc.dn{background:linear-gradient(135deg,color-mix(in srgb,var(--verde) 10%,var(--card)),var(--card))}
.bill-e{font-size:30px;flex:none}
.bill-n{font-weight:800;margin-top:8px}
.bill-s{font-size:26px;font-weight:900;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:0 0 auto!important;margin-left:auto;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--sv);color:var(--verde)}
.pill.r{background:var(--sr);color:var(--rojo)}
.bstrip{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.bstrip button{flex:0 0 auto;background:var(--card);box-shadow:var(--sombra);border-radius:16px;padding:10px 14px;text-align:left;min-width:140px}
.bstrip small{display:block;color:var(--mu);font-weight:700;font-size:12px}
.bstrip b{font-size:17px;font-weight:900}
</style>
</head>
<body>

<div id="auth">
  <div class="au-card">
    <div class="au-emoji">💸</div>
    <h1>Mis Gastos</h1>
    <p>Anotá, mirá y proyectá tu plata 🙌</p>
    <input id="au-mail" class="inp" type="email" placeholder="Email" autocomplete="username">
    <input id="au-pass" class="inp" type="password" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrarConClave()">
    <button id="au-btn" class="btn pri full" onclick="entrarConClave()">Entrar</button>
    <div id="au-err"></div>
    <p style="margin:14px 0 0;font-size:13px">Es la misma cuenta que usás en el minutero.<br><a href="?demo" style="color:var(--azul)">Ver una demo con datos de ejemplo</a></p>
  </div>
</div>

<div id="app-shell">
  <header>
    <div class="hd">
      <div class="logo"><span>💸</span>Mis Gastos</div>
      <div id="sync"></div>
      <button id="gear" class="gear" onclick="irTab('ajustes')" aria-label="Ajustes" title="Ajustes">⚙️</button>
      <div class="mesnav" id="mesnav">
        <button onclick="moverMes(-1)" aria-label="Mes anterior">‹</button>
        <b id="mes-lbl"></b>
        <button onclick="moverMes(1)" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
  <button class="fab" id="fab" onclick="nuevoMov('g')" aria-label="Anotar movimiento">+</button>
</div>

<div id="sheet"><div class="bk" onclick="cerrarSheet()"></div><div class="pn" id="sheet-pn"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
   Mis Gastos — control de gastos personal
   Archivo único. Datos en Supabase (tabla gas_estado), con
   localStorage como caché. Con ?demo corre con datos de ejemplo
   sin tocar la nube.
   ============================================================ */

const mkGrupos = () => GRUPOS_G.map(g => ({id:'g_' + g[0], e:g[1], n:g[2], c:g[3]}));
function grupoInicial(catId){ const g = GRUPOS_G.find(g => g[4].includes(catId)); return 'g_' + (g ? g[0] : 'otros'); }

function estadoVacio(){
  return {v:1, movs:[], fijos:[], grupos:mkGrupos(), cats:mkCats(CATS_G).map(c => Object.assign(c, {g: grupoInicial(c.id)})), catsI:mkCats(CATS_I),

function normalizar(d){
  const b = estadoVacio();
  if(!d || typeof d !== 'object') return b;
  const grupos = Array.isArray(d.grupos) && d.grupos.length ? d.grupos : b.grupos;
  const cats = Array.isArray(d.cats) && d.cats.length ? d.cats : b.cats;
  // categorías sin grupo (datos de antes de los grupos) o con un grupo que ya no existe
  cats.forEach(c => {
    if(grupos.some(g => g.id === c.g)) return;
    const ini = grupoInicial(c.id);
    c.g = grupos.some(g => g.id === ini) ? ini : (grupos.find(g => g.id === 'g_otros') || grupos[grupos.length - 1]).id;
  });
  return {
    v:1,
    movs:   Array.isArray(d.movs) ? d.movs : [],
    fijos:  Array.isArray(d.fijos) ? d.fijos : [],
    grupos,
    cats,
    catsI:  Array.isArray(d.catsI) && d.catsI.length ? d.catsI : b.catsI,
    plan:   Object.assign(b.plan, d.plan || {}),
    extras: Array.isArray(d.extras) ? d.extras : [],
    billeteras: Array.isArray(d.billeteras) ? d.billeteras : [],
    transfs:    Array.isArray(d.transfs) ? d.transfs : [],
    ahorro: Object.assign(b.ahorro, d.ahorro || {}, {
      ajustes: Array.isArray(d.ahorro && d.ahorro.ajustes) ? d.ahorro.ajustes : [],
      metas:   Array.isArray(d.ahorro && d.ahorro.metas) ? d.ahorro.metas : []
    })
  };
}

/* ---------- utilidades ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pad(n){ return (n < 10 ? "0" : "") + n; }
function hoyISO(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function mesActual(){ return hoyISO().slice(0,7); }
function mesSum(m, k){
  let [y, mm] = m.split('-').map(Number); mm += k;
  while(mm > 12){ mm -= 12; y++; } while(mm < 1){ mm += 12; y--; }
  return y + '-' + pad(mm);
}
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DOW = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function mesLabel(m){ const p = m.split('-'); return MESES[+p[1]-1] + ' ' + p[0]; }
function mesCorto(m, conAnio){ const p = m.split('-'); return MES3[+p[1]-1] + (conAnio ? ' ' + p[0].slice(2) : ''); }
function diasEnMes(m){ const [y, mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); }
function fechaLarga(iso){ const [y,m,d] = iso.split('-').map(Number); const dt = new Date(y, m-1, d); return DOW[dt.getDay()] + ' ' + d + ' ' + MES3[m-1]; }
const NF = new Intl.NumberFormat('es-AR', {maximumFractionDigits:0});
function plata(n){ n = Math.round(n || 0); return (n < 0 ? '-' : '') + '$' + NF.format(Math.abs(n)); }
function corto(n){
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  if(a >= 1e6) return s + '$' + (a/1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + 'M';
  if(a >= 1e3) return s + '$' + Math.round(a/1e3) + 'k';
  return s + '$' + Math.round(a);
}
function parseMonto(s){
  s = String(s == null ? '' : s).replace(/[\s$]/g, '');
  if(!s) return NaN;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return Number(s);
}
const suma = (L, f) => L.reduce((a, x) => a + (f ? f(x) : x), 0);

/* ---------- cálculos ---------- */
function catDe(t, id){
  const L = t === 'i' ? S.catsI : S.cats;
  return L.find(c => c.id === id) || {id:'otros', e: t === 'i' ? '💰' : '📦', n:'Otros', c:'#94a3b8', p:0};
}
function fijoActivo(f, m){ return f.desde <= m && (!f.hasta || m <= f.hasta); }
// El monto de un fijo puede cambiar con el tiempo: montos = {'AAAA-MM': monto desde ese mes}
function montoFijo(f, m){
  const ks = Object.keys(f.montos || {}).sort();
  if(!ks.length) return f.monto || 0;
  let v = f.montos[ks[0]];
  ks.forEach(k => { if(k <= m) v = f.montos[k]; });
  return v;
}
function fijosMes(m, t){
  return S.fijos.filter(f => f.t === t && fijoActivo(f, m))
    .map(f => ({f, monto: montoFijo(f, m), pagado: !!(f.pagos && f.pagos[m])}))
    .sort((a, b) => (a.f.dia || 0) - (b.f.dia || 0));
}
function movsMes(m){ return S.movs.filter(x => x.fecha.slice(0,7) === m); }
function totales(m){
  let gv = 0, iv = 0;
  movsMes(m).forEach(x => { if(x.t === 'g') gv += x.monto; else iv += x.monto; });
  const gf = suma(fijosMes(m, 'g'), x => x.monto), fi = suma(fijosMes(m, 'i'), x => x.monto);
  return {gv, iv, gf, fi, g: gv + gf, i: iv + fi, b: iv + fi - gv - gf};
}
function grupoDe(cat){
  return S.grupos.find(g => g.id === (cat && cat.g)) || S.grupos.find(g => g.id === 'g_otros') || {id:'g_otros', e:'📦', n:'Otros', c:'#94a3b8'};
}
function porGrupo(m){
  const o = {};
  porCat(m).forEach(x => { const g = grupoDe(x.cat); (o[g.id] = o[g.id] || {cat: g, v: 0}).v += x.v; });
  return Object.values(o).sort((a, b) => b.v - a.v);
}
function porCat(m){
  const o = {};
  movsMes(m).filter(x => x.t === 'g').forEach(x => o[x.cat] = (o[x.cat] || 0) + x.monto);
  fijosMes(m, 'g').forEach(x => o[x.f.cat] = (o[x.f.cat] || 0) + x.monto);
  return Object.keys(o).map(id => ({cat: catDe('g', id), v: o[id]})).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
}

// BASE = copia de lo último que sé que está en la nube. Sirve para darme cuenta de
// si lo que cambió allá lo hizo solo el bot de WhatsApp (y entonces mezclo sin preguntar).
let BASE = null;
function estable(o){
  if(Array.isArray(o)) return '[' + o.map(estable).join(',') + ']';
  if(o && typeof o === 'object') return '{' + Object.keys(o).sort().map(k => JSON.stringify(k) + ':' + estable(o[k])).join(',') + '}';
  return JSON.stringify(o);
}
function subir(){
  if(!UID || !sb || !CARGADO) return;
  clearTimeout(reintento);
  marcarSync('va');
  const nueva = VERSION + 1, enviado = JSON.parse(JSON.stringify(S));
  sb.from(TABLA)
    .update({datos:enviado, version:nueva, actualizado:new Date().toISOString()})
    .eq('user_id', UID).eq('version', VERSION).select('version')
    .then(function(r){
      if(r.error){ marcarSync('mal'); reintento = setTimeout(subir, 8000); return; }
      if(!r.data || !r.data.length){ fusionarBot(); return; }
      VERSION = nueva; BASE = enviado; guardarLocal(false); marcarSync('ok');
    }, function(){ marcarSync('mal'); reintento = setTimeout(subir, 8000); });
}
// Otro lado guardó primero. Si fue el bot (solo agregó o borró movimientos de WhatsApp),
// sumo sus cambios a lo de esta pantalla y vuelvo a subir; si no, pregunto.
function fusionarBot(){
  sb.from(TABLA).select('datos,version').eq('user_id', UID).maybeSingle().then(function(r){
    if(!r.data || !BASE){ marcarSync('choque'); return; }
    const R = normalizar(r.data.datos), B = normalizar(BASE);
    const sinMovs = d => estable(Object.assign({}, d, {movs: null}));
    if(sinMovs(R) !== sinMovs(B)){ marcarSync('choque'); return; }
    const bm = new Map(B.movs.map(x => [x.id, x])), rm = new Map(R.movs.map(x => [x.id, x]));
    const agregados = R.movs.filter(x => !bm.has(x.id)), borrados = B.movs.filter(x => !rm.has(x.id));
    const tocados = R.movs.filter(x => bm.has(x.id) && estable(bm.get(x.id)) !== estable(x));
    if(tocados.length || agregados.some(x => x.origen !== 'wpp') || borrados.some(x => x.origen !== 'wpp')){ marcarSync('choque'); return; }
    const ids = new Set(S.movs.map(x => x.id)), fuera = new Set(borrados.map(x => x.id));
    S.movs = S.movs.filter(x => !fuera.has(x.id)).concat(agregados.filter(x => !ids.has(x.id)));
    VERSION = r.data.version; BASE = r.data.datos;
    render(); subir();
    if(agregados.length) toast('💬 Llegó '+agregados.length+' gasto'+(agregados.length > 1 ? 's' : '')+' de WhatsApp');
  }, function(){ marcarSync('choque'); });
}
function resolverChoque(){
  const q = 'Se guardaron cambios desde otro dispositivo, así que no piso nada sin preguntarte.\n\n'+
    'Aceptar: traigo lo de la nube y pierdo lo que cargaste acá desde entonces.\n'+
    'Cancelar: subo lo de esta pantalla y piso lo otro.';
  if(confirm(q)) location.reload();
  else sb.from(TABLA).select('datos,version').eq('user_id', UID).maybeSingle()
        .then(r => { if(r.data){ VERSION = r.data.version; BASE = r.data.datos; subir(); } });
}

// Traigo lo último (p. ej. lo que cargó el bot) al volver a la app y cada tanto mientras está abierta
function refrescar(){
  if(document.visibilityState !== 'visible' || !UID || !sb || !CARGADO) return;
  if(sincro === 'mal'){ subir(); return; }
  if(sincro !== 'ok' || document.getElementById('sheet').classList.contains('on')) return;
  sb.from(TABLA).select('datos,version').eq('user_id', UID).maybeSingle().then(r => {
    if(r.data && r.data.version > VERSION && sincro === 'ok' && !document.getElementById('sheet').classList.contains('on')){
      const antes = S.movs.length;
      S = normalizar(r.data.datos); VERSION = r.data.version; BASE = r.data.datos; guardarLocal(false); render();
      toast(S.movs.length > antes ? '💬 Llegaron gastos nuevos' : '🔄 Actualizado con lo último');
    }
  });
}

/* ============================================================
   Gráficos (SVG a mano)
   ============================================================ */
function donut(items, total, alTocar){
  if(!total) return '<div class="vacio">Todavía no hay gastos este mes 🎉</div>';
  let acc = 0;
  const segs = items.map(it => {
    const p = it.v / total * 100;
    const s = '<circle r="15.915" cx="21" cy="21" fill="none" stroke="'+it.cat.c+'" stroke-width="6" stroke-dasharray="'+p.toFixed(3)+' '+(100-p).toFixed(3)+'" stroke-dashoffset="'+(-acc).toFixed(3)+'"><title>'+esc(it.cat.n)+': '+plata(it.v)+'</title></circle>';
    acc += p; return s;
  }).join('');
  const top = items.slice(0, 7), resto = items.slice(7);
  const leg = top.map(it => '<div'+(alTocar ? ' class="clk" onclick="'+alTocar+'(\''+it.cat.id+'\')"' : '')+'><i style="background:'+it.cat.c+'"></i><span>'+it.cat.e+' '+esc(it.cat.n)+'</span><b>'+plata(it.v)+'</b><em>'+Math.round(it.v/total*100)+'%</em>'+(alTocar ? '<u>›</u>' : '')+'</div>').join('') +
    (resto.length ? '<div><i style="background:var(--ln)"></i><span>➕ '+resto.length+' más</span><b>'+plata(suma(resto, x => x.v))+'</b><em>'+Math.round(suma(resto, x => x.v)/total*100)+'%</em></div>' : '');
  return '<div class="donut-wrap"><svg viewBox="0 0 42 42" class="donut"><circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--ln)" stroke-width="6"/>'+segs+
    '<text x="21" y="20">'+'<tspan class="d1">Gastaste</tspan></text><text x="21" y="26" class="d2">'+corto(total)+'</text></svg><div class="leg">'+leg+'</div></div>';
}

function barrasMeses(meses){
  const data = meses.map(m => Object.assign({m}, totales(m)));
  const max = Math.max(1, ...data.map(d => Math.max(d.i, d.g)));
  const W = 340, H = 170, pb = 22, pt = 16, ch = H - pb - pt, bw = W / data.length, w = Math.min(18, bw * 0.28);
  let s = '';
  [0.5, 1].forEach(f => { const y = pt + ch * (1 - f); s += '<line class="gl" x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text x="2" y="'+(y-3)+'" class="ax" style="text-anchor:start">'+corto(max*f)+'</text>'; });
  data.forEach((d, k) => {
    const cx = k * bw + bw / 2, hi = d.i / max * ch, hg = d.g / max * ch;
    s += '<rect class="hit" x="'+(k*bw+2)+'" y="0" width="'+(bw-4)+'" height="'+H+'" rx="10" onclick="irMes(\''+d.m+'\')"><title>'+mesLabel(d.m)+'\nIngresos: '+plata(d.i)+'\nGastos: '+plata(d.g)+'</title></rect>';
    s += '<rect x="'+(cx-w-2)+'" y="'+(pt+ch-hi)+'" width="'+w+'" height="'+Math.max(hi, 0)+'" rx="4" fill="var(--verde)" pointer-events="none"/>';
    s += '<rect x="'+(cx+2)+'" y="'+(pt+ch-hg)+'" width="'+w+'" height="'+Math.max(hg, 0)+'" rx="4" fill="var(--rojo)" pointer-events="none"/>';
    s += '<text x="'+cx+'" y="'+(H-5)+'" class="ax'+(d.m === MES ? ' cur' : '')+'">'+mesCorto(d.m)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart">'+s+'</svg><div class="keys"><span><i style="background:var(--verde)"></i>Ingresos</span><span><i style="background:var(--rojo)"></i>Gastos</span><span style="margin-left:auto">Tocá un mes para verlo 👆</span></div>';
}

function barrasDias(m){
  const n = diasEnMes(m), v = new Array(n).fill(0);
  movsMes(m).filter(x => x.t === 'g').forEach(x => v[+x.fecha.slice(8) - 1] += x.monto);
  const max = Math.max(1, ...v), W = 340, H = 110, pb = 18, ch = H - pb - 6, bw = W / n;
  const hoy = hoyISO(), esHoyMes = hoy.slice(0,7) === m;
  let s = '';
  v.forEach((x, k) => {
    const h = x / max * ch, esHoy = esHoyMes && k + 1 === +hoy.slice(8);
    s += '<rect x="'+(k*bw+1)+'" y="'+(6+ch-h)+'" width="'+(bw-2)+'" height="'+Math.max(h, x ? 2 : 0)+'" rx="2" fill="'+(esHoy ? 'var(--vio)' : 'var(--azul)')+'" opacity="'+(esHoyMes && k + 1 > +hoy.slice(8) ? .3 : 1)+'"><title>'+(k+1)+' '+MES3[+m.slice(5)-1]+': '+plata(x)+'</title></rect>';
    if(k === 0 || (k + 1) % 5 === 0) s += '<text x="'+(k*bw+bw/2)+'" y="'+(H-3)+'" class="ax">'+(k+1)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart">'+s+'</svg>';
}

function lineaSaldo(rows, inicio){
  const pts = [{m: mesActual(), saldo: inicio}].concat(rows);
  const W = 340, H = 180, pl = 4, pr = 4, pt = 18, pb = 22, ch = H - pt - pb, cw = W - pl - pr;
  const vals = pts.map(p => p.saldo), mn = Math.min(0, ...vals), mx = Math.max(1, ...vals);
  const X = k => pl + cw * k / (pts.length - 1), Y = v => pt + ch * (1 - (v - mn) / (mx - mn || 1));
  const line = pts.map((p, k) => X(k).toFixed(1)+','+Y(p.saldo).toFixed(1)).join(' ');
  const area = 'M'+X(0)+','+Y(mn)+' L'+line.split(' ').join(' L')+' L'+X(pts.length-1)+','+Y(mn)+' Z';
  const neg = vals.some(v => v < 0);
  let s = '<defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--azul)" stop-opacity=".35"/><stop offset="1" stop-color="var(--azul)" stop-opacity="0"/></linearGradient></defs>';
  s += '<path d="'+area+'" fill="url(#ga)"/>';
  if(mn < 0) s += '<line x1="0" x2="'+W+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--rojo)" stroke-dasharray="4 4" stroke-width="1.5"/>';
  s += '<polyline points="'+line+'" fill="none" stroke="'+(neg ? 'var(--rojo)' : 'var(--azul)')+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  const paso = Math.ceil(pts.length / 7);
  pts.forEach((p, k) => {
    s += '<circle cx="'+X(k)+'" cy="'+Y(p.saldo)+'" r="'+(k === pts.length - 1 ? 5 : 3)+'" fill="'+(p.saldo < 0 ? 'var(--rojo)' : 'var(--azul)')+'" stroke="var(--card)" stroke-width="1.5"><title>'+mesLabel(p.m)+': '+plata(p.saldo)+'</title></circle>';
    if(k % paso === 0 || k === pts.length - 1) s += '<text x="'+X(k)+'" y="'+(H-4)+'" class="ax" style="text-anchor:'+(k === 0 ? 'start' : k === pts.length - 1 ? 'end' : 'middle')+'">'+(k === 0 ? 'hoy' : mesCorto(p.m, true))+'</text>';
  });
  const u = pts[pts.length - 1];
  s += '<text x="'+(X(pts.length-1)-8)+'" y="'+(Y(u.saldo)-10)+'" class="ax" style="text-anchor:end;font-size:12px;font-weight:900;fill:var(--tx)">'+corto(u.saldo)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart">'+s+'</svg>';
}

function barrasProy(rows){
  const max = Math.max(1, ...rows.map(r => Math.max(r.ing, r.gas)));
  const W = 340, H = 150, pb = 20, pt = 8, ch = H - pb - pt, bw = W / rows.length, w = Math.max(3, Math.min(12, bw * 0.3));
  const paso = Math.ceil(rows.length / 8);
  let s = '';
  rows.forEach((r, k) => {
    const cx = k * bw + bw / 2, hi = r.ing / max * ch, hg = r.gas / max * ch;
    s += '<rect x="'+(cx-w-1)+'" y="'+(pt+ch-hi)+'" width="'+w+'" height="'+hi+'" rx="3" fill="var(--verde)"><title>'+mesLabel(r.m)+' ingresos: '+plata(r.ing)+'</title></rect>';
    s += '<rect x="'+(cx+1)+'" y="'+(pt+ch-hg)+'" width="'+w+'" height="'+hg+'" rx="3" fill="var(--rojo)"><title>'+mesLabel(r.m)+' gastos: '+plata(r.gas)+'</title></rect>';
    if(r.ex.length) s += '<text x="'+cx+'" y="'+(pt+ch-Math.max(hi,hg)-3)+'" class="ax" style="font-size:10px">⭐</text>';
    if(k % paso === 0) s += '<text x="'+cx+'" y="'+(H-4)+'" class="ax">'+mesCorto(r.m)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart">'+s+'</svg><div class="keys"><span><i style="background:var(--verde)"></i>Ingresos</span><span><i style="background:var(--rojo)"></i>Gastos</span><span>⭐ mes con extra</span></div>';
}

/* ----- 🔮 Proyección ----- */
function base(){
  const act = mesActual();
  // promedio de gasto/ingreso variable de los últimos 3 meses cerrados que tengan datos;
  // si no hay historia uso el mes en curso estirado a 30 días
  const prev = [1,2,3].map(k => mesSum(act, -k)).filter(m => movsMes(m).length);
  let gv, iv, fuente;
  if(prev.length){
    gv = suma(prev, m => totales(m).gv) / prev.length;
    iv = suma(prev, m => totales(m).iv) / prev.length;
    fuente = 'promedio de '+prev.map(m => mesCorto(m)).join(', ');
  } else {
    const T = totales(act), d = Math.max(1, +hoyISO().slice(8)), f = d >= 25 ? 1 : diasEnMes(act) / d;
    gv = T.gv * f; iv = T.iv; fuente = 'lo que va de este mes';
  }
  return {gv, iv, fuente};
}
function proyectar(){
  const b = base(), P = S.plan, act = mesActual();
  const gvBase = P.gastoVar !== '' && P.gastoVar != null && !isNaN(parseMonto(P.gastoVar)) ? parseMonto(P.gastoVar) : b.gv;
  const ivBase = P.ingVar !== '' && P.ingVar != null && !isNaN(parseMonto(P.ingVar)) ? parseMonto(P.ingVar) : b.iv;
  const gv = gvBase * (1 - (+P.recorte || 0) / 100);
  const inicio = parseMonto(P.ahorro) || ahorroInfo().total;  // vacío = lo calculado en 🐷 Ahorros
  let saldo = inicio;
  const rows = [];
  for(let k = 1; k <= (+P.meses || 12); k++){
    const m = mesSum(act, k);
    const fi = Math.pow(1 + (+P.infl || 0) / 100, k), fa = Math.pow(1 + (+P.aumIng || 0) / 100, k);
    const fijG = suma(S.fijos.filter(f => f.t === 'g' && fijoActivo(f, m)), f => montoFijo(f, act));
    const fijI = suma(S.fijos.filter(f => f.t === 'i' && fijoActivo(f, m)), f => montoFijo(f, act));
    let ing = (fijI + ivBase) * fa, gas = (fijG + gv) * fi;
    const ex = S.extras.filter(e => e.mes === m);
    ex.forEach(e => { if(e.t === 'i') ing += e.monto; else gas += e.monto; });
    saldo += ing - gas;
    rows.push({m, ing, gas, bal: ing - gas, saldo, ex});
  }
  return {b, gvBase, ivBase, gv, inicio, rows};
}
function vProy(){
  const P = S.plan, b = base();
  const num = (k, ph, suf) => '<input class="inp" inputmode="decimal" value="'+esc(P[k])+'" placeholder="'+esc(ph)+'" oninput="setPlan(\''+k+'\',this.value)">'+(suf || '');
  return '<div class="stack"><div id="proy-hero"></div>'+
    '<div class="cols"><div class="stack">'+
    '<div class="card"><h2>💰 Saldo proyectado</h2><div id="proy-linea"></div></div>'+

      '<div class="mov" onclick="editarExtra(\''+e.id+'\')"><span class="ico" style="background:'+(e.t === 'i' ? 'var(--sv)' : 'var(--sr)')+'">'+(e.e || (e.t === 'i' ? '🎉' : '⭐'))+'</span><div class="mt"><b>'+esc(e.desc || 'Extra')+'</b><small>'+mesLabel(e.mes)+(e.mes <= mesActual() ? ' · ya pasó' : '')+'</small></div><span class="mm '+e.t+'">'+(e.t === 'g' ? '-' : '+')+plata(e.monto)+'</span></div>').join('')
      : '<div class="vacio">Nada planificado 🗓️</div>')+

}
function setPlan(k, v){
  S.plan[k] = v;
  if(k === 'recorte'){ const l = document.getElementById('rec-lbl'); if(l) l.textContent = v + '%'; }
  save(); pintarProy();
}
function pintarProy(){
  const R = proyectar(), rows = R.rows;
  if(!rows.length) return;
  const fin = rows[rows.length - 1], rojo = rows.find(r => r.saldo < 0);
  const prom = suma(rows, r => r.bal) / rows.length, ingProm = suma(rows, r => r.ing) / rows.length;
  const tasa = ingProm ? Math.round(prom / ingProm * 100) : 0;
  const mood = rojo ? '😰' : tasa >= 20 ? '🚀' : tasa >= 5 ? '🌱' : '🤏';
  document.getElementById('proy-hero').innerHTML =
    '<div class="hero'+(fin.saldo < 0 ? ' neg' : '')+'"><div class="mood">'+mood+'</div>'+
    '<div class="lbl">En '+rows.length+' meses ('+mesLabel(fin.m).toLowerCase()+') tendrías</div>'+
    '<div class="big">'+plata(fin.saldo)+'</div>'+
    '<div class="sub">'+(prom >= 0 ? 'Ahorrás en promedio '+plata(prom)+' por mes ('+tasa+'% de lo que entra)' : 'Perdés en promedio '+plata(-prom)+' por mes')+'</div></div>'+
    (rojo ? '<div class="tipbox r" style="margin-top:14px">🚨 En <b>'+mesLabel(rojo.m).toLowerCase()+'</b> te quedarías en rojo. Probá con el recorte de gastos o revisá los fijos.</div>' : '')+
    (!(+S.plan.recorte) && R.gv > 0 ? '<div class="tipbox v" style="margin-top:14px">💡 Si recortás un 10% del gasto variable, en '+rows.length+' meses juntás <b>'+plata(R.gv * 0.1 * suma(rows.map((r, k) => Math.pow(1 + (+S.plan.infl || 0) / 100, k + 1))))+'</b> más.</div>' : '');
  document.getElementById('proy-linea').innerHTML = lineaSaldo(rows, R.inicio);
  document.getElementById('proy-barras').innerHTML = barrasProy(rows);
  document.getElementById('proy-tabla').innerHTML = '<table class="t"><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Ahorro</th><th>Acumulado</th></tr>'+
    rows.map(r => '<tr><td>'+(r.ex.length ? '⭐ ' : '')+mesCorto(r.m, true)+'</td><td>'+corto(r.ing)+'</td><td>'+corto(r.gas)+'</td><td class="'+(r.bal >= 0 ? 'pos' : 'neg')+'">'+corto(r.bal)+'</td><td class="'+(r.saldo >= 0 ? '' : 'neg')+'">'+corto(r.saldo)+'</td></tr>').join('')+'</table>';
}

/* ----- 💳 Billeteras ----- */
// Una billetera es "dinero" (plata física o digital) o "tarjeta" (arranca en 0 y muestra la deuda).
// El saldo = el que cargaste (base) + todo lo registrado DESPUÉS de cargarlo (ts > b.ts):
// gastos/ingresos anotados con esa billetera, fijos tildados como pagados y transferencias.
// Así lo anterior no se cuenta dos veces: ya está dentro del saldo que pusiste.
// Pagar la tarjeta es una transferencia dinero → tarjeta: no es un gasto nuevo.
function billPrincipal(){ return S.billeteras.find(b => b.tipo === 'dinero') || S.billeteras[0] || null; }
function billDe(id){ return S.billeteras.find(b => b.id === id) || billPrincipal(); }
function billIdDe(id){ const b = billDe(id); return b ? b.id : null; }
function ultimaBill(t){
  let id = null;
  try{ id = localStorage.getItem('gastos_bill_' + t); }catch(e){}
  return billIdDe(id);
}
function recordarBill(t, id){ try{ localStorage.setItem('gastos_bill_' + t, id); }catch(e){} }
function chipsBill(titulo, fn){
  if(!S.billeteras.length) return '';
  return '<label class="lb">'+titulo+'</label><div class="chips">'+S.billeteras.map(b =>
    '<button class="chip'+(F.bill === b.id ? ' on' : '')+'" style="--c:'+(b.tipo === 'tarjeta' ? 'var(--vio)' : 'var(--verde)')+'" onclick="'+fn+'(\''+b.id+'\')">'+esc(b.e)+' '+esc(b.nombre)+'</button>').join('')+'</div>';
}
function efectosBill(b){
  const out = [], idDe = id => billIdDe(id);
  S.movs.forEach(x => {
    if(idDe(x.bill) !== b.id || (x.ts || 0) <= b.ts) return;
    const c = catDe(x.t, x.cat);
    out.push({ts: x.ts, fecha: x.fecha, monto: x.t === 'g' ? -x.monto : x.monto, desc: x.desc || c.n, e: c.e, k: 'mov', ref: x.id});
  });
  S.fijos.forEach(f => {
    if(idDe(f.bill) !== b.id) return;
    Object.keys(f.pagos || {}).forEach(m => {
      const ts = f.pagos[m];
      if(typeof ts !== 'number' || ts <= b.ts) return;   // tildado antes de fijar el saldo (o de versiones viejas)
      const v = montoFijo(f, m), c = catDe(f.t, f.cat);
      out.push({ts, fecha: m + '-' + pad(Math.min(f.dia || 1, diasEnMes(m))), monto: f.t === 'g' ? -v : v, desc: f.nombre + ' (' + mesCorto(m) + ')', e: c.e, k: 'fijo'});
    });
  });
  S.transfs.forEach(t => {
    if(t.ts <= b.ts) return;
    if(t.de === b.id) out.push({ts: t.ts, fecha: t.fecha, monto: -t.monto, desc: t.desc || ('A ' + (billDe(t.a) || {}).nombre), e: '🔁', k: 'tr', ref: t.id});
    if(t.a === b.id) out.push({ts: t.ts, fecha: t.fecha, monto: t.monto, desc: t.desc || ('Desde ' + (billDe(t.de) || {}).nombre), e: '🔁', k: 'tr', ref: t.id});
  });
  return out.sort((x, y) => y.ts - x.ts);
}
function saldoBill(b){ return (+b.base || 0) + suma(efectosBill(b), e => e.monto); }

function tarjetaBill(b){
  const s = saldoBill(b), tj = b.tipo === 'tarjeta';
  const movsMesAct = efectosBill(b).filter(e => e.monto < 0 && e.k !== 'tr' && e.fecha.slice(0,7) === mesActual()).length;
  return '<div class="card billc '+(tj ? 'tj' : 'dn')+'" onclick="verBill(\''+b.id+'\')">'+
    '<div class="row" style="align-items:flex-start"><span class="bill-e">'+esc(b.e)+'</span>'+
    (tj ? '<span class="pill '+(s < 0 ? 'r' : 'v')+'">'+(s < 0 ? 'A pagar' : '✅ Al día')+'</span>' : '<span class="pill v">Disponible</span>')+'</div>'+
    '<div class="bill-n">'+esc(b.nombre)+'</div>'+
    '<div class="bill-s '+(s < 0 ? 'neg' : '')+'">'+(tj ? plata(Math.abs(s)) : plata(s))+'</div>'+
    '<div class="mu" style="font-size:12px;font-weight:700;margin-top:2px">'+(tj ? (s < 0 ? 'debés' : s > 0 ? 'a favor' : 'sin deuda') + ' · ' + movsMesAct + ' gasto' + (movsMesAct === 1 ? '' : 's') + ' este mes' : 'saldo actual')+'</div>'+
    (tj && s < 0 ? '<button class="btn sm ok" style="margin-top:12px;width:100%" onclick="event.stopPropagation();pagarTarjeta(\''+b.id+'\')">💸 Pagar tarjeta</button>' : '')+
    '</div>';
}
function vBilleteras(){
  const D = S.billeteras.filter(b => b.tipo === 'dinero'), T = S.billeteras.filter(b => b.tipo === 'tarjeta');
  if(!S.billeteras.length) return '<div class="stack"><div class="hero"><div class="mood">👛</div><div class="lbl">Billeteras</div><div class="big" style="font-size:30px">¿Dónde está tu plata?</div>'+
    '<div class="sub">Cargá cuánto tenés hoy y tus tarjetas. Cada gasto que anotes va a descontar de donde lo pagaste.</div></div>'+
    '<div class="grid g2"><button class="card" style="text-align:left" onclick="nuevaBill(\'dinero\')"><div style="font-size:34px">💵</div><b style="font-size:17px">Agregar mi plata</b><div class="mu" style="font-weight:600;font-size:13px">Física o digital, lo que tenés hoy</div></button>'+
    '<button class="card" style="text-align:left" onclick="nuevaBill(\'tarjeta\')"><div style="font-size:34px">💳</div><b style="font-size:17px">Agregar una tarjeta</b><div class="mu" style="font-weight:600;font-size:13px">Arranca en $0 y suma lo que gastás con ella</div></button></div></div>';
  const dinero = suma(D, saldoBill), deuda = -suma(T, b => Math.min(0, saldoBill(b)));
  const libre = dinero - deuda;
  let h = '<div class="stack"><div class="hero'+(libre < 0 ? ' neg' : '')+'"><div class="mood">👛</div><div class="lbl">Tu plata hoy</div><div class="big">'+plata(dinero)+'</div>'+
    '<div class="sub">💳 Debés en tarjetas '+plata(deuda)+' · 🟢 Después de pagarlas te quedan '+plata(libre)+'</div></div>';
  h += '<div class="card"><h2>💵 Dinero<small><button class="btn sm" onclick="nuevaBill(\'dinero\')">+ Agregar</button></small></h2>'+
    (D.length ? '<div class="grid bills">'+D.map(tarjetaBill).join('')+'</div>' : '<div class="vacio">Agregá dónde tenés tu plata 💵</div>')+'</div>';
  h += '<div class="card"><h2>💳 Tarjetas<small><button class="btn sm" onclick="nuevaBill(\'tarjeta\')">+ Agregar</button></small></h2>'+
    (T.length ? '<div class="grid bills">'+T.map(tarjetaBill).join('')+'</div>' : '<div class="vacio">Agregá tus tarjetas para saber cuánto debés en cada una 💳</div>')+'</div>';
  const tr = S.transfs.slice().sort((a, b) => b.ts - a.ts).slice(0, 10);
  h += '<div class="card"><h2>🔁 Transferencias<small><button class="btn sm" onclick="nuevaTransf()">+ Nueva</button></small></h2>'+
    (tr.length ? tr.map(t => { const de = billDe(t.de), a = billDe(t.a);
      return '<div class="mov" onclick="editarTransf(\''+t.id+'\')"><span class="ico" style="background:var(--sa)">🔁</span><div class="mt"><b>'+esc(t.desc || ((de ? de.e + ' ' + de.nombre : '?') + ' → ' + (a ? a.e + ' ' + a.nombre : '?')))+'</b><small>'+(de ? esc(de.nombre) : '?')+' → '+(a ? esc(a.nombre) : '?')+' · '+fechaLarga(t.fecha)+'</small></div><span class="mm">'+plata(t.monto)+'</span></div>'; }).join('')
      : '<div class="vacio">Cuando pagues una tarjeta o muevas plata entre billeteras, aparece acá</div>')+
    '<p class="mu" style="font-size:13px;margin:10px 4px 0;font-weight:600">💡 Las transferencias no cuentan como gasto: el gasto ya lo anotaste cuando compraste con la tarjeta.</p></div>';
  return h + '</div>';
}

/* detalle de una billetera */
function verBill(id){
  const b = S.billeteras.find(x => x.id === id); if(!b) return;
  const s = saldoBill(b), tj = b.tipo === 'tarjeta', ef = efectosBill(b).slice(0, 40);
  abrirSheet('<div class="sh-h"><h3>'+esc(b.e)+' '+esc(b.nombre)+'</h3><button class="x" onclick="cerrarSheet()">✕</button></div>'+
    '<div class="tipbox'+(s < 0 ? ' r' : ' v')+'" style="margin-top:14px;font-size:15px">'+(tj ? (s < 0 ? 'Debés <b>'+plata(-s)+'</b>' : '✅ Sin deuda'+(s > 0 ? ' · a favor '+plata(s) : '')) : 'Tenés <b>'+plata(s)+'</b>')+'</div>'+
    '<div class="grid g2" style="margin-top:12px">'+
      (tj && s < 0 ? '<button class="btn ok" onclick="pagarTarjeta(\''+b.id+'\')">💸 Pagar</button>' : '<button class="btn" onclick="nuevaTransf(\''+b.id+'\')">🔁 Transferir</button>')+
      '<button class="btn" onclick="ajustarBill(\''+b.id+'\')">✏️ Corregir saldo</button></div>'+
    '<label class="lb">Últimos movimientos</label>'+
    (ef.length ? ef.map(e => '<div class="mov"'+(e.k === 'mov' ? ' onclick="editarMov(\''+e.ref+'\')"' : e.k === 'tr' ? ' onclick="editarTransf(\''+e.ref+'\')"' : '')+'><span class="ico" style="background:var(--in)">'+e.e+'</span><div class="mt"><b>'+esc(e.desc)+'</b><small>'+fechaLarga(e.fecha)+'</small></div><span class="mm '+(e.monto < 0 ? 'g' : 'i')+'">'+(e.monto < 0 ? '-' : '+')+plata(Math.abs(e.monto))+'</span></div>').join('')
      : '<div class="vacio">Nada desde que cargaste el saldo</div>')+
    '<p class="mu" style="font-size:12px;margin:10px 4px 0;font-weight:600">Saldo cargado: '+plata(tj ? -(+b.base || 0) : +b.base || 0)+(tj ? ' de deuda' : '')+' el '+new Date(b.ts).toLocaleDateString('es-AR')+'. Desde ahí se suma y resta solo.</p>'+
    '<div class="row" style="margin-top:16px"><button class="btn del" style="flex:0 0 auto" onclick="borrarBill(\''+b.id+'\')">🗑️</button><button class="btn" onclick="editarBill(\''+b.id+'\')">✏️ Nombre e ícono</button></div>');
}

/* alta / edición */
const EMO_BILL = {dinero: ['💵','🏦','💰','👛','📱','🪙'], tarjeta: ['💳','🟥','🟦','🟩','🟨','⬛']};
function nuevaBill(tipo){ F = {id:null, tipo, e: EMO_BILL[tipo][0], nombre:'', monto:''}; formBill(); }
function editarBill(id){ const b = S.billeteras.find(x => x.id === id); F = {id:b.id, tipo:b.tipo, e:b.e, nombre:b.nombre}; formBill(); }
function formBill(){
  const tj = F.tipo === 'tarjeta';
  abrirSheet('<div class="sh-h"><h3>'+(F.id ? '✏️ Editar' : tj ? '💳 Nueva tarjeta' : '💵 Nueva billetera')+'</h3><button class="x" onclick="cerrarSheet()">✕</button></div>'+
    '<label class="lb">Ícono</label><div class="chips">'+EMO_BILL[F.tipo].map(e => '<button class="chip'+(F.e === e ? ' on' : '')+'" style="font-size:20px;padding:6px 10px" onclick="F.e=\''+e+'\';formBill()">'+e+'</button>').join('')+'</div>'+
    '<label class="lb">Nombre</label><input class="inp" value="'+esc(F.nombre)+'" placeholder="'+(tj ? 'Ej: Visa Santander' : 'Ej: Mi plata')+'" oninput="F.nombre=this.value">'+
    (F.id ? '' : '<label class="lb">'+(tj ? '¿Cuánto debés hoy en esta tarjeta? (si nada, dejalo en 0)' : '¿Cuánto tenés hoy?')+'</label>'+montoIn(tj ? 'g' : 'i', F.monto, 'guardarBill'))+
    '<div class="row" style="margin-top:18px"><button class="btn pri" onclick="guardarBill()">Guardar ✓</button></div>');
}
function guardarBill(){
  if(!F.nombre.trim()) return toast('Ponele un nombre ✏️');
  if(F.id){ Object.assign(S.billeteras.find(x => x.id === F.id), {e: F.e, nombre: F.nombre.trim()}); }
  else {
    let v = F.monto === '' ? 0 : parseMonto(F.monto);
    if(isNaN(v) || v < 0) return toast('Revisá el monto 💵');
    S.billeteras.push({id: uid(), tipo: F.tipo, e: F.e, nombre: F.nombre.trim(), base: F.tipo === 'tarjeta' ? -v : v, ts: Date.now()});
  }
  save(); cerrarSheet(); render(); toast(F.tipo === 'tarjeta' ? '💳 Tarjeta guardada' : '💵 Billetera guardada');
}
function ajustarBill(id){
  const b = S.billeteras.find(x => x.id === id), s = saldoBill(b);
  F = {id, monto: NF.format(Math.abs(s))};
  abrirSheet('<div class="sh-h"><h3>✏️ Corregir saldo</h3><button class="x" onclick="cerrarSheet()">✕</button></div>'+
    '<label class="lb">'+(b.tipo === 'tarjeta' ? '¿Cuánto debés ahora en '+esc(b.nombre)+'?' : '¿Cuánto tenés ahora en '+esc(b.nombre)+'?')+'</label>'+
    montoIn(b.tipo === 'tarjeta' ? 'g' : 'i', F.monto, 'guardarAjusteBill')+
    '<p class="mu" style="font-size:12px;margin:8px 4px 0;font-weight:600">Desde ahora el saldo arranca de este número. No cambia tus gastos ni tus reportes.</p>'+
    '<div class="row" style="margin-top:18px"><button class="btn pri" onclick="guardarAjusteBill()">Guardar ✓</button></div>');
  focoMonto();
}
function guardarAjusteBill(){
  const v = parseMonto(F.monto);
  if(isNaN(v) || v < 0) return toast('Revisá el monto 💵');
  const b = S.billeteras.find(x => x.id === F.id);
  b.base = b.tipo === 'tarjeta' ? -v : v; b.ts = Date.now();
  save(); cerrarSheet(); render(); toast('✏️ Saldo corregido');
}
function borrarBill(id){
  const b = S.billeteras.find(x => x.id === id);
  if(!confirm('¿Borrar "'+b.nombre+'"?\n\nLos gastos anotados con ella no se borran: pasan a contar en tu billetera principal.')) return;
  S.billeteras = S.billeteras.filter(x => x.id !== id);
  S.transfs = S.transfs.filter(t => t.de !== id && t.a !== id);
  save(); cerrarSheet(); render(); toast('🗑️ Billetera borrada');
}

/* transferencias */
function nuevaTransf(de, a, monto, desc){
  const D = S.billeteras.filter(b => b.tipo === 'dinero');
  F = {id:null, de: de || (D[0] || S.billeteras[0] || {}).id, a: a || (S.billeteras.find(b => b.id !== (de || (D[0] || {}).id)) || {}).id, monto: monto ? NF.format(monto) : '', fecha: hoyISO(), desc: desc || ''};
  formTransf(); if(!monto) focoMonto();
}
function pagarTarjeta(id){
  const b = S.billeteras.find(x => x.id === id), deuda = -saldoBill(b), D = billPrincipal();
  nuevaTransf(D && D.id !== id ? D.id : null, id, deuda > 0 ? deuda : '', 'Pago ' + b.nombre);
}
function editarTransf(id){ const t = S.transfs.find(x => x.id === id); if(!t) return; F = Object.assign({}, t, {monto: NF.format(t.monto)}); formTransf(); }
function formTransf(){
  const ch = (campo) => '<div class="chips">'+S.billeteras.map(b => '<button class="chip'+(F[campo] === b.id ? ' on' : '')+'" onclick="F.'+campo+'=\''+b.id+'\';formTransf()">'+esc(b.e)+' '+esc(b.nombre)+'</button>').join('')+'</div>';
  abrirSheet('<div class="sh-h"><h3>🔁 '+(F.id ? 'Editar transferencia' : 'Transferir')+'</h3><button class="x" onclick="cerrarSheet()">✕</button></div>'+
    montoIn('i', F.monto, 'guardarTransf')+
    '<label class="lb">📤 Desde</label>'+ch('de')+
    '<label class="lb">📥 Hacia</label>'+ch('a')+
    '<div class="row"><div><label class="lb">📅 Fecha</label><input class="inp" type="date" value="'+F.fecha+'" onchange="F.fecha=this.value"></div></div>'+
    '<label class="lb">📝 Detalle (opcional)</label><input class="inp" value="'+esc(F.desc)+'" placeholder="Ej: Pago Visa" oninput="F.desc=this.value">'+
    '<div class="row" style="margin-top:18px">'+(F.id ? '<button class="btn del" style="flex:0 0 auto" onclick="borrarTransf()">🗑️</button>' : '')+
    '<button class="btn pri" onclick="guardarTransf()">Guardar ✓</button></div>');
}
function guardarTransf(){
  const v = parseMonto(F.monto);
  if(!(v > 0)) return toast('Poné un monto 💵');
  if(!F.de || !F.a) return toast('Elegí desde y hacia 💳');
  if(F.de === F.a) return toast('Elegí dos billeteras distintas 🔁');
  const t = {id: F.id || uid(), de: F.de, a: F.a, monto: v, fecha: F.fecha || hoyISO(), desc: (F.desc || '').trim(), ts: F.ts || Date.now()};
  const i = S.transfs.findIndex(x => x.id === t.id);
  if(i >= 0) S.transfs[i] = t; else S.transfs.push(t);
  save(); cerrarSheet(); render();
  const a = billDe(t.a);
  toast(a && a.tipo === 'tarjeta' && saldoBill(a) >= 0 ? '🎉 Tarjeta pagada' : '🔁 Transferencia guardada');
}
function borrarTransf(){ S.transfs = S.transfs.filter(x => x.id !== F.id); save(); cerrarSheet(); render(); }

/* ----- 🐷 Ahorros ----- */
// Lo ahorrado se calcula solo: punto de partida + lo que sobró cada mes (ingresos - gastos)
// + ajustes a mano (intereses, retiros). Las metas reparten ese total en "apartados".
function primerMes(){
  const ms = S.movs.map(x => x.fecha.slice(0,7)).sort();
  return ms[0] || mesActual();
}
function aportadoMeta(mt){ return suma(mt.aportes || [], a => a.monto); }
function ahorroInfo(){
  const A = S.ahorro, act = mesActual();
  let desde = /^\d{4}-\d{2}$/.test(A.desde || '') ? A.desde : primerMes();
  if(desde > act) desde = act;
  const ajMes = m => suma(A.ajustes.filter(a => a.fecha.slice(0,7) === m), a => a.monto);
  // ajustes anteriores al punto de partida cuentan como parte del saldo inicial
  let cerrado = (parseMonto(A.inicial) || 0) + suma(A.ajustes.filter(a => a.fecha.slice(0,7) < desde), a => a.monto);
  const pts = [];
  for(let m = desde, n = 0; m < act && n < 240; m = mesSum(m, 1), n++){
    const t = totales(m), aj = ajMes(m);
    cerrado += t.b + aj;
    pts.push({m, b: t.b, i: t.i, aj, saldo: cerrado});
  }
  const tAct = totales(act), ajAct = ajMes(act);
  const total = cerrado + ajAct;                       // lo que tenés hoy sin contar el mes en curso
  const recientes = pts.slice(-6);
  const prom = recientes.length ? suma(recientes, p => p.b) / recientes.length : tAct.b;
  const ingRec = suma(recientes, p => p.i);
  const tasa = ingRec ? suma(recientes, p => p.b) / ingRec * 100 : 0;
  const mejor = pts.reduce((a, p) => !a || p.b > a.b ? p : a, null);
  const enMetas = suma(A.metas, aportadoMeta);
  return {desde, pts, total, enCurso: tAct.b, prom, tasa, mejor, enMetas, libre: total - enMetas};
}

function lineaAhorro(pts){
  if(pts.length < 2) return '<div class="vacio">Cuando cierren un par de meses acá vas a ver cómo crece 🌱</div>';
  const W = 340, H = 170, pt = 18, pb = 22, ch = H - pt - pb;
  const vals = pts.map(p => p.saldo), mn = Math.min(0, ...vals), mx = Math.max(1, ...vals);
  const X = k => 4 + (W - 8) * k / (pts.length - 1), Y = v => pt + ch * (1 - (v - mn) / (mx - mn || 1));
  const line = pts.map((p, k) => X(k).toFixed(1)+','+Y(p.saldo).toFixed(1)).join(' ');
  let s = '<defs><linearGradient id="gv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--verde)" stop-opacity=".35"/><stop offset="1" stop-color="var(--verde)" stop-opacity="0"/></linearGradient></defs>';
  s += '<path d="M'+X(0)+','+Y(mn)+' L'+line.split(' ').join(' L')+' L'+X(pts.length-1)+','+Y(mn)+' Z" fill="url(#gv)"/>';
  s += '<polyline points="'+line+'" fill="none" stroke="var(--verde)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  const paso = Math.ceil(pts.length / 7);
  pts.forEach((p, k) => {
    s += '<circle cx="'+X(k)+'" cy="'+Y(p.saldo)+'" r="'+(k === pts.length - 1 ? 5 : 3)+'" fill="var(--verde)" stroke="var(--card)" stroke-width="1.5"><title>Fin de '+mesLabel(p.m)+': '+plata(p.saldo)+'</title></circle>';
    if(k % paso === 0 || k === pts.length - 1) s += '<text x="'+X(k)+'" y="'+(H-4)+'" class="ax" style="text-anchor:'+(k === 0 ? 'start' : k === pts.length - 1 ? 'end' : 'middle')+'">'+mesCorto(p.m, true)+'</text>';
  });
  const u = pts[pts.length - 1];
  s += '<text x="'+(X(pts.length-1)-8)+'" y="'+(Y(u.saldo)-10)+'" class="ax" style="text-anchor:end;font-size:12px;font-weight:900;fill:var(--tx)">'+corto(u.saldo)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart">'+s+'</svg>';
}
function barrasAhorro(pts){
  if(!pts.length) return '<div class="vacio">Todavía no cerró ningún mes 🗓️</div>';
  const P = pts.slice(-12), W = 340, H = 150, pt = 16, pb = 20, ch = H - pt - pb;
  const mx = Math.max(1, ...P.map(p => p.b)), mn = Math.min(0, ...P.map(p => p.b));
  const Y = v => pt + ch * (1 - (v - mn) / (mx - mn || 1)), bw = W / P.length, w = Math.min(26, bw * 0.6);
  let s = '<line class="gl" x1="0" x2="'+W+'" y1="'+Y(0)+'" y2="'+Y(0)+'"/>';
  P.forEach((p, k) => {
    const cx = k * bw + bw / 2, y0 = Y(0), y1 = Y(p.b), pc = p.i ? Math.round(p.b / p.i * 100) : 0;
    s += '<rect x="'+(cx-w/2)+'" y="'+Math.min(y0, y1)+'" width="'+w+'" height="'+Math.max(1, Math.abs(y1 - y0))+'" rx="4" fill="'+(p.b >= 0 ? 'var(--verde)' : 'var(--rojo)')+'"><title>'+mesLabel(p.m)+': '+plata(p.b)+' ('+pc+'% de lo que entró)</title></rect>';
    if(P.length <= 8) s += '<text x="'+cx+'" y="'+(p.b >= 0 ? y1 - 4 : y0 - 4)+'" class="ax" style="font-size:9px">'+pc+'%</text>';
    s += '<text x="'+cx+'" y="'+(H-4)+'" class="ax">'+mesCorto(p.m)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart">'+s+'</svg><div class="keys"><span>Lo que te sobró cada mes y qué % de lo que entró</span></div>';
}

function filaMeta(mt, A){
  const ap = aportadoMeta(mt), obj = +mt.objetivo || 0, pc = obj ? Math.min(100, ap / obj * 100) : 0, falta = Math.max(0, obj - ap);
  const act = mesActual();
  let nota;
  if(obj && ap >= obj) nota = '🎉 ¡Meta cumplida!';
  else if(mt.fecha){
    const meses = Math.max(1, (+mt.fecha.slice(0,4) - +act.slice(0,4)) * 12 + (+mt.fecha.slice(5) - +act.slice(5)));
    nota = mt.fecha < act ? '⏰ Se pasó la fecha ('+mesLabel(mt.fecha).toLowerCase()+') · faltan '+plata(falta)
      : '📅 Para '+mesLabel(mt.fecha).toLowerCase()+' apartá '+plata(falta / meses)+' por mes';
  } else if(A.prom > 0){
    const n = Math.ceil(falta / A.prom);
    nota = '🏃 A tu ritmo de ahorro llegás en ~'+n+' mes'+(n === 1 ? '' : 'es');
  } else nota = 'Faltan '+plata(falta);
  return '<div class="meta"><div class="row" style="gap:12px"><span class="ico" style="background:var(--sv);flex:none">'+esc(mt.e || '🎯')+'</span>'+
    '<div class="mt" onclick="editarMeta(\''+mt.id+'\')" style="cursor:pointer"><b>'+esc(mt.nombre)+'</b><small>'+plata(ap)+' de '+plata(obj)+' · '+Math.round(pc)+'%</small></div>'+
    '<button class="btn sm ok" style="flex:none" onclick="aportarMeta(\''+mt.id+'\')">+ Apartar</button></div>'+
    '<div class="pbar" style="height:12px;margin:10px 0 6px"><i style="width:'+pc.toFixed(1)+'%;background:linear-gradient(90deg,#16a34a,#0d9488)"></i></div>'+
    '<div class="mu" style="font-size:13px;font-weight:700">'+nota+'</div></div>';
}

      : '<div class="vacio">Poné una meta: un viaje ✈️, un fondo de emergencia 🛟, la compu nueva 💻…</div>')+'</div>';
  h += '<div class="card"><h2>🏁 Punto de partida</h2>'+
    '<p class="mu" style="margin:-4px 0 4px;font-size:13px;font-weight:600">Lo que ya tenías ahorrado cuando empezaste a usar la app. Desde ahí se suma solo lo que te sobra cada mes.</p>'+
    '<div class="row"><div><label class="lb">💰 Tenía ahorrado</label><input class="inp" inputmode="decimal" placeholder="0" value="'+(+SA.inicial ? NF.format(SA.inicial) : '')+'" onchange="setAhorro(\'inicial\',this.value)"></div>'+

      : '<div class="vacio">Sin ajustes</div>')+'</div>';
  h += '</div></div></div>';
  return h;
}

function borrarCat(k){
  const t = CATTAB, L = t === 'i' ? S.catsI : S.cats, c = L[k];
  if(L.length <= 1) return toast('Necesitás al menos una categoría');
  const usos = S.movs.filter(x => x.t === t && x.cat === c.id).length + S.fijos.filter(x => x.t === t && x.cat === c.id).length;
  const destino = L.find(x => x.id === 'otros' && x !== c) || L.find(x => x !== c);
  if(!confirm('¿Borrar "'+c.n+'"?' + (usos ? '\n\nTiene '+usos+' movimiento(s); pasan a "'+destino.n+'".' : ''))) return;
  S.movs.forEach(x => { if(x.t === t && x.cat === c.id) x.cat = destino.id; });

function guardarFijo(){
  const monto = parseMonto(F.monto);
  if(!F.nombre.trim()) return toast('Ponele un nombre ✏️');
  if(!(monto > 0)) return toast('Poné un monto 💵');
  if(!/^\d{4}-\d{2}$/.test(F.desde || '')) return toast('Elegí desde qué mes 📆');
  let dia = parseInt(F.dia, 10); if(!(dia >= 1 && dia <= 31)) dia = null;
  if(F.id){
    const f = S.fijos.find(x => x.id === F.id);
    f.nombre = F.nombre.trim(); f.cat = F.cat; f.dia = dia; f.desde = F.desde;
    if(F.bill) f.bill = F.bill;
    if(montoFijo(f, MES) !== monto){
      f.montos = f.montos || {};
      // el cambio vale desde el mes que estás mirando; borro cambios posteriores que ya no aplican
      Object.keys(f.montos).forEach(k => { if(k > MES) delete f.montos[k]; });
      f.montos[MES < f.desde ? f.desde : MES] = monto;
    }
    f.monto = monto;
  } else {
    S.fijos.push({id: uid(), t: F.t, nombre: F.nombre.trim(), monto, montos: {[F.desde]: monto}, cat: F.cat, dia, desde: F.desde, hasta: null, pagos: {}, bill: F.bill || null});
  }
  save(); cerrarSheet(); render(); toast('📌 Fijo guardado');
}
function bajaFijo(){
  const f = S.fijos.find(x => x.id === F.id); if(!f) return;
  const hasta = mesSum(MES, -1);
  if(hasta < f.desde){
    if(!confirm('¿Borrar "'+f.nombre+'"? Arrancaba en '+mesLabel(f.desde).toLowerCase()+', así que se borra del todo.')) return;
    S.fijos = S.fijos.filter(x => x.id !== f.id);
  } else {
    if(!confirm('¿Dar de baja "'+f.nombre+'"?\n\nDeja de contar desde '+mesLabel(MES).toLowerCase()+'. Los meses anteriores quedan registrados.')) return;
    f.hasta = hasta;
  }
  save(); cerrarSheet(); render(); toast('👋 Dado de baja');
}

function errAuth(msg){ document.getElementById('au-err').textContent = msg || ''; }
function mostrarLogin(){

}
// RAPIDO = la app ya está mostrando lo guardado en este dispositivo mientras trae lo de la nube.
// CARGADO = ya tengo la versión de la nube; hasta entonces no subo nada.
let RAPIDO = false, CARGADO = false, _reArr = null;
function arrancar(u){
  if(!sb){
    errAuth('No se pudo cargar la librería de Supabase. Revisá la conexión y recargá.');
    mostrarLogin(); return;
  }
  clearTimeout(_reArr);
  (u ? Promise.resolve({data: {user: u}}) : sb.auth.getUser()).then(function(ru){
    const u = ru.data && ru.data.user;
    if(!u){ mostrarLogin(); return; }
    UID = u.id; MAIL = u.email || '';
    try{ localStorage.setItem(LS_META, JSON.stringify(Object.assign(leerMeta(), {mail: MAIL}))); }catch(e){}
    sb.from(TABLA).select('datos,version').eq('user_id', UID).maybeSingle().then(function(r){
      if(r.error){
        const faltaTabla = r.error.code === 'PGRST205' || /could not find the table|relation .* does not exist/i.test(r.error.message || '');
        const sesionVencida = r.error.code === 'PGRST301' || /jwt/i.test(r.error.message || '');
        if(RAPIDO && !faltaTabla && !sesionVencida){ sinConexion(); return; }
        if(sesionVencida){ errAuth('Tu sesión venció, volvé a entrar.'); mostrarLogin(); return; }
        errAuth(faltaTabla
          ? 'Falta crear la tabla en Supabase: corré gastos-schema.sql en el SQL editor y volvé a entrar.'
          : 'Entraste, pero no pude leer tus datos: ' + r.error.message);
        mostrarLogin(); return;
      }
      if(!r.data){ primeraVez(); return; }
      const nube = normalizar(r.data.datos);
      VERSION = r.data.version; BASE = r.data.datos; CARGADO = true;
      const meta = leerMeta(), local = leerLocal();
      if(meta.pendiente && local && tieneContenido(local)){
        // cambios hechos en este dispositivo que no llegaron a la nube
        if(meta.version >= VERSION){ S = local; abrirApp(); saveNow(); return; }       // la nube no cambió: subo sin preguntar
        if(confirm('Hay cambios en este dispositivo que no llegaron a la nube, y mientras tanto se guardó algo desde otro lado.\n\nAceptar: subo los de acá (pisan lo otro).\nCancelar: uso lo de la nube.')){
          S = local; abrirApp(); saveNow(); return;
        }
      }
      S = nube; abrirApp(); guardarLocal(false);
    }, sinConexion);
  }, sinConexion);
}
function sinConexion(){
  if(!RAPIDO){ errAuth('No hay conexión. Revisá internet y recargá.'); mostrarLogin(); return; }
  const el = document.getElementById('sync');
  if(el) el.innerHTML = '<span class="sync mal"><i></i>Sin conexión</span>';
  clearTimeout(_reArr); _reArr = setTimeout(() => arrancar(), 10000);
}
function primeraVez(){
  S = estadoVacio();
  sb.from(TABLA).insert({user_id: UID, datos: S, version: 1}).select('version').then(function(r){
    if(r.error){ alert('No pude crear tu registro en la nube: ' + r.error.message); return; }
    VERSION = 1; CARGADO = true; BASE = JSON.parse(JSON.stringify(S)); guardarLocal(false); abrirApp(); marcarSync('ok');
    toast('🎉 ¡Listo! Ya guarda en la nube');
  });
}
function abrirApp(){
  document.getElementById('auth').classList.remove('on');
  document.getElementById('app-shell').classList.add('on');
  marcarSync('ok');
  render();
}
